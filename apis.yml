aid: mile
name: Mile
description: Mile is an AI-native supply chain execution platform for brands and distributors
  that own their inventory and fulfill orders directly to customers. It unifies Order Management
  (OMS), Warehouse Management (WMS), and Transportation / last-mile delivery (TMS) in a single
  system, with MAC, an AI agent that acts on exceptions rather than only flagging them. Mile
  exposes a partner REST API at lastmile.milenow.com covering orders, customers, products,
  categories and brands, promotion bundles, routes, drivers, vehicles, warehouse inbound
  orders, Aramex shipping, order optimization, and configurable webhooks for order-status,
  order-creation, settlement, and inventory-transfer events.
