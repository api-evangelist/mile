      - name: include_synced
        in: query
        description: value = 0 means unsynced, value = 1 means synced
        schema:
          type: integer
          enum:
          - 0
          - 1
      responses:
        '200':
          description: Get All Orders in date range
  /api/v1/partners/external/push:
    post:
      tags:
      - Export
      summary: Push the Order To external
      description: This call Push the Order To external
      operationId: post_app_apiv1_trackingapi_externalpushapi
      parameters:
      - name: access_token
        in: query
        description: Access Token
        schema:
          type: string
      responses:
        '200':
          description: Push the Order To external
  /api/v1/partners/track/orders/pull:
    get:
      tags:
      - Export
